<!doctype html>
<html lang="en">
<head><title>Heading beside bare text</title></head>
<body>
<main>
<div class="callout"><h4>Note</h4>Remember to restart.<br>Also clear caches.</div>
<p>A paragraph after the callout so the page has more than one block in it.</p>
<div class="mw-heading"><h2>A wrapped heading</h2></div>
<p>The wrapper above holds only its heading, so it is still unwrapped.</p>
</main>
</body>
</html>
